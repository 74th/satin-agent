apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# The app image is set by scripts/deploy.sh (kustomize edit set image) after build-images.sh.
images:
  - name: satin-app
    newName: us-central1-docker.pkg.dev/nnyn-dev/satin-agent/satin-app
    newTag: dev
# satin-config comes from satin.yaml; scripts/deploy.sh fills in agent.id from .satin-state.json.
configMapGenerator:
  - name: satin-config
    namespace: satin-system
    files:
      - satin.yaml
generatorOptions:
  disableNameSuffixHash: true
