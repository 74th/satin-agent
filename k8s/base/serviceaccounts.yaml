# Google Cloud access for the Bot (Gemini / Model Armor) and for Sandboxes (read assets from GCS)
# is granted to these KSAs directly via Workload Identity Federation for GKE (see terraform/).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: satin-cma-orchestrator
  namespace: satin-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: satin-cc-orchestrator
  namespace: satin-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: satin-slack-bot
  namespace: satin-system
---
# Used by Sandbox Pods. No Kubernetes API token is mounted (automountServiceAccountToken: false).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: satin-sandbox
  namespace: satin-sandboxes
automountServiceAccountToken: false
