# Orchestrators manage Sandboxes, their Secrets / policies / PVCs and the status ConfigMaps.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: satin-sandbox-management
  namespace: satin-sandboxes
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["networking.gke.io"]
    resources: ["fqdnnetworkpolicies"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: satin-sandbox-management
  namespace: satin-sandboxes
subjects:
  - kind: ServiceAccount
    name: satin-cma-orchestrator
    namespace: satin-system
  - kind: ServiceAccount
    name: satin-cc-orchestrator
    namespace: satin-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: satin-sandbox-management
---
# The Bot only reads / writes the two ConfigMaps shared with the orchestrator
# (session -> user mapping, Sandbox states). It never touches Sandboxes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: satin-bot
  namespace: satin-sandboxes
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: satin-bot
  namespace: satin-sandboxes
subjects:
  - kind: ServiceAccount
    name: satin-slack-bot
    namespace: satin-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: satin-bot
