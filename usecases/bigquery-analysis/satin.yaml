# satin publish --config usecases/bigquery-analysis/satin.yaml --assets usecases/bigquery-analysis/assets
assets:
  state_file: .satin-state-bigquery.json   # run publish from the repo root
  gcs_url: gs://nnyn-dev-satin-agent-assets/satin/bigquery-analysis/
agent:
  name: satin-bigquery-agent
  model: claude-haiku-5-5
  bash_always_ask: true   # Botのagent: bashはBotが確認に応答する
kubernetes:
  context: gke_nnyn-dev_us-central1-a_silk-agent-gke
  sandbox_namespace: satin-sandboxes
gcp:
  project: nnyn-dev
