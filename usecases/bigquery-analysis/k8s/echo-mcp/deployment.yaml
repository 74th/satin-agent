apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-mcp
  namespace: satin-mcp
  labels: {app.kubernetes.io/name: echo-mcp}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: echo-mcp}
  template:
    metadata:
      labels: {app.kubernetes.io/name: echo-mcp}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: echo-mcp
          image: echo-mcp
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: ECHO_MCP_API_KEY
              valueFrom:
                secretKeyRef: {name: echo-mcp-api-key, key: api-key}
          # Every HTTP request needs the key, so probe the TCP port instead.
          readinessProbe:
            tcpSocket: {port: http}
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
