# Used only by the BigQuery use case's Sandbox Pods. Workload Identity impersonates the GSA that
# usecases/bigquery-analysis/terraform manages. No Kubernetes API token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: satin-bq-sandbox
  namespace: satin-sandboxes
  annotations:
    iam.gke.io/gcp-service-account: "__GSA_EMAIL__"   # filled by scripts/deploy.sh (GSA_EMAIL)
automountServiceAccountToken: false
